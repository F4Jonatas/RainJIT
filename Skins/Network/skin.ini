; cSpell:ignoreRegExp rainmeter|Jonatas|ICONSIZE|FONTSIZE

[rainmeter]
	author         = F4Jonatas
	update         = 1000
	accurateText   = 1

[metadata]
	name        = RainJIT-Network
	author      = F4Jonatas
	version     = 1.2
	license     = GPL v2.0 License
	information = RainJIT simple test skin.

[variables]
	@include   = #@#globals.inc
	@include2  = styles.inc

	SCALE      = 1
	WIDTH      = ( 400 * #SCALE# )
	HEIGHT     = ( 150 * #SCALE# )
	RADIUS     = 6
	MARGIN_TOP = 45




[netIn]
	measure       = netIn
	; updateDivider = 10

[netOut]
	measure       = netOut
	; updateDivider = 10

[lua]
	measure = plugin
	plugin  = RainJIT
	script  = script.lua


[body]
	meter         = shape
	shape         = rectangle 0, 0, #WIDTH#, #HEIGHT#, #RADIUS# | fill color #GLOBALS_DARK_BACKGROUND# | strokeWidth 0
	updateDivider = -1


[icon]
	meter          = string
	meterStyle     = paused | segoe-icons-font | antialias | align-center
	fontSize       = 18
	y              = ( #MARGIN_TOP# / 2 )
	x              = 25
	h              = #MARGIN_TOP#
	text           = [\xE874]
	inlinePattern  = ^(.*)$
	inlineSetting  = shadow | 0 | 0.5 | 1 | 0,0,0,120
	inlinePattern2 = ^(.*)$
	inlineSetting2 = gradientColor | 90 | 220, 220, 220 ; 0.0 | 240, 240, 240 ; 0.8


[title]
	meter          = string
	meterStyle     = paused | segoe-semibold-font | antialias | align-left
	fontSize       = 12
	text           = "Network"
	y              = ( #MARGIN_TOP# / 2 )
	x              = 45
	h              = #MARGIN_TOP#
	inlinePattern  = ^(.*)$
	inlineSetting  = shadow | 0 | 0.5 | 1 | 0,0,0,120
	inlinePattern2 = ^(.*)$
	inlineSetting2 = gradientColor | 90 | 220, 220, 220 ; 0.0 | 255, 255, 255 ; 0.8
	inlinePattern3 = ^(.*)$
	inlineSetting3 = gradientColor | 90 | 220, 220, 220 ; 0.0 | 255, 255, 255 ; 0.8


[graphic]
	meter         = shape
	w             = #WIDTH#
	x             = 0
	y             = #MARGIN_TOP#
	updateDivider = -1


[value.Max]
	meter          = string
	meterStyle     = paused | text-white| segoe-font | antialias | align-right
	x              = ( #WIDTH# - 8 )
	y              = ( #MARGIN_TOP# - 9 )
	fontSize       = ( 9 * #SCALE# )


[value.Min]
	meter          = string
	meterStyle     = paused | text-white| segoe-font | antialias | align-right
	x              = ( #WIDTH# - 12 )
	y              = ( #HEIGHT# - 17 )
	fontSize       = ( 9 * #SCALE# )
	Text           = "0 B"


[value]
	meter          = string
	meterStyle     = paused | text-white| segoe-font | antialias | align-right
	x              = ( 80  * #SCALE# )
	y              = ( 100 * #SCALE# )
	w              = ( 70  * #SCALE# )
	h              = ( 40  * #SCALE# )
	fontSize       = ( 10  * #SCALE# )
