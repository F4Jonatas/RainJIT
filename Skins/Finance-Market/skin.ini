[rainmeter]
	author          = F4Jonatas
	update          = 1000
	backgroundMode  = 2
	solidColor      = 0,0,0,130
	skinHeight      = #HEIGHT#
	skinWidth       = #WIDTH#

[metadata]
	name        = Rain-Finance-Market
	author      = F4Jonatas
	version     = 1.1
	license     = GPL v2.0 License
	information = RainJIT simple test skin.

[variables]
	@include   = #@#globals.inc

	SCALE      = 1
	WIDTH      = ( 400 * #SCALE# )
	HEIGHT     = ( 150 * #SCALE# )
	RADIUS     = 6
	MARGIN_TOP = 45



[lua]
	measure    = plugin
	plugin     = RainJIT
	script     = script.lua


[icon]
	meter          = string
	stringAlign    = centerCenter
	fontFace       = rFont
	antialias      = 1
	fontSize       = 18
	y              = ( #MARGIN_TOP# / 2 )
	x              = 25
	h              = #MARGIN_TOP#
	text           = [\xE89B]
	inlinePattern  = ^(.*)$
	inlineSetting  = shadow | 0 | 0.5 | 1 | 0,0,0,120
	inlinePattern2 = ^(.*)$
	inlineSetting2 = gradientColor | 90 | 220, 220, 220 ; 0.0 | 240, 240, 240 ; 0.8
	updateDivider  = -1

[title]
	meter          = string
	stringAlign    = leftCenter
	fontSize       = ( 12 * #SCALE# )
	antialias      = 1
	text           = "Finance Market"
	fontFace       = rFont
	y              = ( #MARGIN_TOP# / 2 )
	x              = 45
	h              = #MARGIN_TOP#
	inlinePattern  = ^(.*)$
	inlineSetting  = shadow | 0 | 0.5 | 1 | 0,0,0,120
	inlinePattern2 = ^(.*)$
	inlineSetting2 = gradientColor | 90 | 220, 220, 220 ; 0.0 | 255, 255, 255 ; 0.8
	updateDivider  = -1

[symbolName]
	meter          = string
	stringAlign    = rightCenter
	fontSize       = ( 10 * #SCALE# )
	antialias      = 1
	fontFace       = rFont
	y              = ( #MARGIN_TOP# / 2 )
	x              = ( #WIDTH# - 10 - ( ( 10 * #SCALE# ) / 2 ))
	h              = #MARGIN_TOP#
	inlinePattern  = ^(.*)$
	inlineSetting  = shadow | 0 | 0.5 | 1 | 0,0,0,120
	inlinePattern2 = ^(.*)$
	inlineSetting2 = gradientColor | 90 | 220, 220, 220 ; 0.0 | 255, 255, 255 ; 0.8
	updateDivider  = -1
