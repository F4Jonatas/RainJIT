[rainmeter]
	author         = F4Jonatas
	update         = 1000
	accurateText   = 1


[metadata]
	name        = RainJIT-Calendar
	author      = Smurfier & F4Jonatas
	version     = 1.2
	license     = GPL v2.0 License
	information = @See https://forum.rainmeter.net/viewtopic.php?t=11073

[variables]
	@include      = #@#globals.inc
	@include2     = styles.inc

	SCALE         = 1
	RADIUS        = 6
	MARGIN_TOP    = 45
	MARGIN_BOTTOM = 6
	MARGIN_LEFT   = 9
	WIDTH         = ( 250 * #SCALE# )
	HEIGHT        = ( 243 * #SCALE# )
	CELL_W        = ( 25  * #SCALE# )
	CELL_H        = ( 20  * #SCALE# )
	FILL_VIBRANT  = 128, 192, 255, 160
	FONT_VIBRANT  = 128, 192, 255, 160



[lua]
	measure = plugin
	plugin  = RainJIT
	script  = script.lua


[body]
	meter         = shape
	meterStyle    = paused
	shape         = rectangle 0,0, #WIDTH#, #HEIGHT#, #RADIUS# |fill color #GLOBALS_DARK_BACKGROUND# | strokeWidth 0
	group         = Calendar


[subtitle]
	meter       = string
	meterStyle  = paused | segoe-semibold-font
	x           = 12
	y           = ( #MARGIN_TOP# / 2 )
	w           = ( #WIDTH# - 20 )
	h           = #MARGIN_TOP#
	fontColor   = 255,255,255,220
	stringAlign = leftCenter
	fontSize    = 12
	antiAlias   = 1
	group       = Calendar


[control-next]
	meter             = string
	meterStyle        = paused | textstyle | bold | segoe-icons-font
	stringAlign       = centerCenter
	text              = "[\XE09B]"
	y                 = 22
	x                 = ( #WIDTH# - 18 )
	leftMouseUpAction = [!commandMeasure "lua" "navigate(1)"]
	group             = controls


[control-prev]
	meter             = string
	meterStyle        = paused | textstyle | control-next | bold | segoe-icons-font
	text              = "[\XE09A]"
	x                 = ( #WIDTH# - 44 )
	y                 = r
	leftMouseUpAction = [!commandMeasure "lua" "navigate(-1)"]


