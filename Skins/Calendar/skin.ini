[rainmeter]
	author         = F4Jonatas
	update         = 1000
	accurateText   = 1

; ContextTitle=Next Month
; ContextAction=[!CommandMeasure Lua Move(1)][!Update]
; ContextTitle2=Next Year
; ContextAction2=[!CommandMeasure Lua Move(12)][!Update]
; ContextTitle3=Previous Month
; ContextAction3=[!CommandMeasure Lua Move(-1)][!Update]
; ContextTitle4=Previous Year
; ContextAction4=[!CommandMeasure Lua Move(-12)][!Update]
; ContextTitle5=Current Month
; ContextAction5=[!CommandMeasure Lua Move()][!Update]
; MouseScrollUpAction=!CommandMeasure Lua "CombineScroll(-1)"
; MouseScrollDownAction=!CommandMeasure Lua "CombineScroll(1)"


[metadata]
	name        = RainJIT-Calendar
	author      = F4Jonatas
	version     = 1.2
	license     = GPL v2.0 License
	information = RainJIT simple test skin.

[variables]
	@include      = #@#globals.inc
	@include2     = styles.inc

	SCALE         = 1
	RADIUS        = 6
	MARGIN_TOP    = 45
	MARGIN_BOTTOM = 6
	MARGIN_LEFT   = 9
	WIDTH         = ( 250 * #SCALE# )
	HEIGHT        = ( 230 * #SCALE# )
	CELL_W        = ( 25  * #SCALE# )
	CELL_H        = ( 20  * #SCALE# )
	FILL_VIBRANT  = 128, 192, 255, 160
	FONT_VIBRANT  = 128, 192, 255, 160



[lua]
	measure = plugin
	plugin  = RainJIT
	script  = script.lua


[body]
	meter         = shape
	meterStyle    = paused
	shape         = rectangle 0,0, #WIDTH#, #HEIGHT#, #RADIUS# |fill color #GLOBALS_DARK_BACKGROUND# | strokeWidth 0
	updatedivider = -1
	group         = Calendar


[subtitle]
	meter       = string
	meterStyle  = paused | segoe-semibold-font
	x           = 12
	y           = ( #MARGIN_TOP# / 2 )
	w           = ( #WIDTH# - 20 )
	h           = #MARGIN_TOP#
	fontColor   = 255,255,255,220
	stringAlign = leftCenter
	fontSize    = 12
	antiAlias   = 1
	group       = Calendar
	; solidColor = 0,255,0,60


[control-forward]
	meter             = string
	meterStyle        = paused | textstyle | bold | segoe-icons-font
	stringAlign       = centerCenter
	text              = [\XE09B]
	y                 = 22
	x                 = ( #WIDTH# - 18 )
	leftMouseUpAction = [!commandMeasure "lua" "nextmonth()"]
	group             = controls


[control-back]
	meter             = string
	meterStyle        = paused | textstyle | control-forward | bold | segoe-icons-font
	text              = [\XE09A]
	x                 = ( #WIDTH# - 44 )
	y                 = r
	leftMouseUpAction = [!commandMeasure "lua" "prevmonth()"]


[weekday1]
	meter       = string
	meterStyle  = lbltxtsty | paused | segoe-semibold-font
	x           = ( 11 + ( #CELL_W# / 2 ))
	y           = ( #MARGIN_TOP# + ( #CELL_H# / 2 ))


