
[rainmeter]
	author         = F4Jonatas
	update         = 1000
	accurateText   = 1
	backgroundMode = 2
	solidColor     = #GLOBALS_DARK_BACKGROUND#

[metadata]
	name        = RainJIT-Radio.net
	author      = F4Jonatas
	version     = 1.1
	license     = GPL v2.0 License
	information = RainJIT simple test skin.



[variables]
	@include   = #@#globals.inc
	@include2  = styles.inc

	SCALE      = 1.0
	WIDTH      = ( 400 * #SCALE# )
	HEIGHT     = ( 150 * #SCALE# )
	FONTSIZE   = ( 8   * #SCALE# )
	RADIUS     = 6
	MARGIN_TOP = 45






[lua]
	measure = plugin
	plugin  = RainJIT
	script  = script.lua


[body]
	meter         = shape
	shape         = rectangle 0,0, #WIDTH#, #HEIGHT#, #RADIUS# |fill color ffffff00 | strokeWidth 0
	updatedivider = -1


[icon]
	meter               = image
	imagePath           = icons\
	imageName           = radio-net
	x                   = ( #WIDTH# - [&icon:W] - 20 )
	y                   = 20
	w                   = ( 25 * #SCALE# )
	preserveAspectRatio = 1
	dynamicVariables    = 1
	updateDivider       = -1


[controls-play_plause]
	meter            = string
	meterStyle       = paused | bold | segoe-icons-font | text-white | antialias | dynamic | align-center | font-size-12 | font-shadow
	text             = [\XEDDA]
	x                = (( #WIDTH# / 2 ) - ( [&controls-play_plause:W] / 2 ))
	y                = 120
	InlinePattern    = (.+)
	InlineSetting    = shadow | 0 | 0 | 3.5 | 0,0,0,200


[controls-prev]
	meter            = string
	meterStyle       = paused | bold | segoe-icons-font | text-white | antialias | dynamic | align-center | font-size-12 | font-shadow
	text             = [\XF8AC]
	x                = (( #WIDTH# / 4 ) - ( [&controls-prev:W] / 2 ))
	y                = r


[controls-next]
	meter            = string
	meterStyle       = paused | bold | segoe-icons-font | text-white | antialias | dynamic | align-center | font-size-12 | font-shadow
	text             = [\XF8AD]
	x                = ( #WIDTH# - ( #WIDTH# / 4 ) - ( [&controls-next:W] / 2 ))
	y                = r


[image-container]
	meter          = shape
	shape          = rectangle 0, 0, ( 50 * #SCALE# ), ( 50 * #SCALE# ), #RADIUS# | strokeWidth 0
	x              = 20
	y              = 20
	updateDivider  = -1


[image]
	meter               = image
	container           = image-container
	imagePath           = icons\
	imageName           = energy98
	w                   = [&image-container:W]
	h                   = [&image-container:H]
	preserveAspectRatio = 1
	updateDivider       = -1


[song]
	meter          = string
	meterStyle     = paused | segoe-font | text-white | antialias | align-left
	fontSize       = ( 11 * #SCALE# )
	clipString     = 1
	x              = ( [&image:X] + [&image:W] + 10 )
	y              = (( [&image:Y] * 2 ) + (( 10 * #SCALE# ) / 2 ))
	w              = ( #WIDTH# - [&song:X] - ( [&icon:W] * 2 ) - 10 )
	h              = [&image:H]
	inlinePattern  = (.+)
	inlineSetting  = shadow | 0 | 0.5 | 1 | 0,0,0,90
	inlinePattern2 = \r?\n(.*)$
	inlineSetting2 = size | ( 9 * #SCALE# )
	inlinePattern3 = \n(.*)$
	inlineSetting3 = color | 220,220,220
	inlinePattern4 = (.+)
	inlineSetting4  = characterSpacing | 1
