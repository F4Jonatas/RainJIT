
[rainmeter]
	author         = F4Jonatas
	update         = 1000
	accurateText   = 1
	backgroundMode = 2
	solidColor     = #GLOBALS_DARK_BACKGROUND#

[metadata]
	name        = RainJIT-Radio.net
	author      = F4Jonatas
	version     = 1.1
	license     = GPL v2.0 License
	information = RainJIT simple test skin.



[variables]
	@include   = #@#globals.inc
	@include2  = styles.inc

	SCALE      = 1.0
	WIDTH      = ( 400 * #SCALE# )
	HEIGHT     = ( 150 * #SCALE# )
	FONTSIZE   = ( 8   * #SCALE# )
	RADIUS     = 6
	MARGIN_TOP = 45






[lua]
	measure = plugin
	plugin  = RainJIT
	script  = script.lua


[body]
	meter         = shape
	shape         = rectangle 0,0, #WIDTH#, #HEIGHT#, #RADIUS# |fill color ffffff00 | strokeWidth 0
	updatedivider = -1


[icon]
	meter               = image
	imagePath           = icons\
	imageName           = radio-net
	x                   = ( #WIDTH# - [&icon:W] - 20 )
	y                   = 20
	w                   = ( 25 * #SCALE# )
	preserveAspectRatio = 1
	dynamicVariables    = 1
	updateDivider       = -1


[controls-play_plause]
	meter            = shape
	shape            = ellipse 14.5,14,13 |fill color 00000064 |strokewidth 0
	shape2           = path paths1|strokewidth 0
	paths1           = 20.003,12.6688|curveTo 20.6708,13.1138,21.0046,13.3364,21.121,13.617|curveTo 21.2226,13.8622,21.2226,14.1378,21.121,14.383|curveTo 21.0046,14.6636,20.6708,14.8862,20.003,15.3312|lineTo 12.4876,20.3416|curveTo 11.6794,20.8804,11.2754,21.1498,10.9404,21.1298|curveTo 10.6486,21.1122,10.3788,20.968,10.2024,20.7348|curveTo 10,20.4672,10,19.9816,10,19.0104|lineTo 10,8.9896|curveTo 10,8.0185,10,7.5329,10.2024,7.2652|curveTo 10.3788,7.032,10.6486,6.8877,10.9404,6.8703|curveTo 11.2754,6.8503,11.6794,7.1196,12.4876,7.6583|lineTo 20.003,12.6688|closePath 1
	x                = (( #WIDTH# / 2 ) - ( [&controls-play_plause:W] / 2 ))
	y                = 110
	dynamicVariables = 1
	updateDivider    = -1


[controls-prev]
	meter            = shape
	shape            = ellipse 14.5,14,13 |fill color 00000064 |strokewidth 0
	shape2           = path paths1|strokewidth 0|fill color ffffff
	paths1           = 16.677,8.63|lineTo 19.865,8.63|lineTo 19.865,20.1|lineTo 16.677,20.1|lineTo 16.677,8.63|closePath 1|lineTo 7.017,13.243|curveTo 6.485,13.599,6.219,13.775,6.125,14|curveTo 6.046,14.196,6.046,14.415,6.125,14.611|curveTo 6.219,14.833,6.485,15.012,7.017,15.366|lineTo 13.2,19.5|curveTo 13.843,19.927,14.031,20.118,14.3,20.1|curveTo 14.531,20.089,14.688,19.984,14.829,19.8|curveTo 14.99,19.586,14.99,19.172,14.99,18.4|lineTo 14.99,10.312|curveTo 14.99,9.537,14.99,9.151,14.829,8.938|curveTo 14.688,8.75,14.472,8.636,14.241,8.622|curveTo 13.972,8.607,13.65,8.821,13.007,9.25|lineTo 7.017,13.243|closePath 1
	x                = (( #WIDTH# / 4 ) - ( [&controls-prev:W] / 2 ))
	y                = r
	dynamicVariables = 1
	updateDivider    = -1


[controls-next]
	meter            = shape
	shape            = ellipse 14.5,14,13 |fill color 00000064 |strokewidth 0
	shape2           = path paths1|strokewidth 0
	paths1           = 10.5028,6.908|lineTo 7.6516,6.908|lineTo 7.6516,17.072|lineTo 10.5028,17.072|lineTo 10.5028,6.908|closePath 1|lineTo 19.1418,11.0546|curveTo 19.6178,11.3714,19.8563,11.5306,19.939,11.7304|curveTo 20.0112,11.9046,20.0112,12.1018,19.939,12.276|curveTo 19.8563,12.4766,19.6178,12.635,19.1418,12.9518|lineTo 13.7852,16.5238|curveTo 13.2088,16.9074,12.921,17.0993,12.6826,17.0852|curveTo 12.474,17.0729,12.2822,16.9699,12.1563,16.8036|curveTo 12.012,16.6126,12.012,16.2668,12.012,15.5742|lineTo 12.012,8.4322|curveTo 12.012,7.7396,12.012,7.3938,12.1563,7.2028|curveTo 12.2822,7.0365,12.474,6.9335,12.6826,6.9212|curveTo 12.921,6.9071,13.2088,7.099,13.7852,7.4826|lineTo 19.1418,11.0546|closePath 1
	x                = ( #WIDTH# - ( #WIDTH# / 4 ) - ( [&controls-next:W] / 2 ))
	y                = r
	dynamicVariables = 1
	updateDivider    = -1


[image-container]
	meter          = shape
	shape          = rectangle 0, 0, ( 50 * #SCALE# ), ( 50 * #SCALE# ), #RADIUS# | strokeWidth 0
	x              = 20
	y              = 20
	updateDivider  = -1


[image]
	meter               = image
	container           = image-container
	imagePath           = icons\
	imageName           = energy98
	w                   = [&image-container:W]
	h                   = [&image-container:H]
	preserveAspectRatio = 1
	updateDivider       = -1


[song]
	meter          = string
	meterStyle     = paused | font-rFont | text-white | antialias | align-left
	fontSize       = ( 11 * #SCALE# )
	clipString     = 1
	x              = ( [&image:X] + [&image:W] + 10 )
	y              = (( [&image:Y] * 2 ) + (( 10 * #SCALE# ) / 2 ))
	w              = ( #WIDTH# - [&song:X] - ( [&icon:W] * 2 ) - 10 )
	h              = [&image:H]
	inlinePattern  = (.*)
	inlineSetting  = shadow | 0 | 0.5 | 1 | 0,0,0,90
	inlinePattern2 = \r?\n(.*)$
	inlineSetting2 = size | ( 9 * #SCALE# )
	inlinePattern3 = \n(.*)$
	inlineSetting3 = color | 220,220,220
